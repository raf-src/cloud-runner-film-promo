<!doctype html>
<html lang="en">
  <head>
    <!-- Set the page's text encoding and mobile-friendly layout. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Describe this page for search engines and link previews. -->
    <meta
      name="description"
      content="The official soundtrack to Cloud Runner"
    >

    <!-- Load Bootstrap and the site's styles and icons. -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="assets/css/styles.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Set the icon shown in the browser tab. -->
    <link rel="icon" type="image/svg+xml" href="assets/images/cloud-runner-svg.svg">

    <title>Soundtrack | Cloud Runner</title>
  </head>

  <body>
    <!-- Soundtrack page hero area, with navigation and background video. -->
    <header class="hero music-hero">
      <!-- Main navigation; Bootstrap collapses it on smaller screens. -->
      <nav
        class="navbar navbar-expand-lg navbar-dark bg-transparent cloud-navbar"
        aria-label="Primary navigation"
      >
        <div class="container-fluid cloud-navbar__inner">
          <!-- The site name links back to the home page. -->
          <a
            class="navbar-brand cloud-home"
            href="index.html"
            aria-label="Cloud Runner home"
          >
            CLOUD RUNNER
          </a>

          <!-- This button opens and closes the navigation on smaller screens. -->
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavigation"
            aria-controls="mainNavigation"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Page links; the soundtrack link is marked as the current page. -->
          <div class="collapse navbar-collapse" id="mainNavigation">
            <ul class="navbar-nav ms-auto align-items-lg-center">
              <li class="nav-item">
                <a class="nav-link cloud-nav-link" href="index.html#trailer">
                  TRAILER
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link cloud-nav-link" href="gallery.html">
                  GALLERY
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link cloud-nav-link" href="updates.html">
                  GET UPDATES
                </a>
              </li>
              <li class="nav-item">
                <a
                  class="nav-link cloud-nav-link cloud-nav-link--music active"
                  href="music.html"
                  aria-current="page"
                >
                  SOUNDTRACK
                </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <!-- Muted, looping video used as the page's background. -->
      <video autoplay muted loop playsinline class="trailer-video-bg">
        <source
          src="assets/videos/cloud-runner-video-background-music-page.mp4"
          type="video/mp4"
        >
        <!-- This message appears if the browser can't play the video. -->
        Your browser does not support the video tag.
      </video>

      <!-- Soundtrack announcement and link to the updates signup page. -->
      <div class="hero-content">
        <h1>COMING SOON</h1>
        <br>
        <p>OFFICIAL SOUNDTRACK — "SKYBOUND" BY FREYA LINDHOLM</p>
        <a class="btn btn-outline-light" href="updates.html#updates-form-wrapper">
          GET UPDATES
        </a>
      </div>
    </header>

    <!-- Footer with site links, copyright, and social-media links. -->
    <footer class="site-footer">
      <div class="site-footer__inner">
        <div class="site-footer__left">
          <nav class="site-footer__nav" aria-label="Footer navigation">
            <a href="#contact">CONTACT</a>
            <a href="#privacy">PRIVACY POLICY</a>
            <a href="#terms">TERMS OF USE</a>
          </nav>
          <p class="site-footer__copyright">
            © 2027 IRON SKY FILMS. ALL RIGHTS RESERVED.
          </p>
        </div>

        <!-- Social links open in a new tab; Font Awesome supplies each icon. -->
        <nav class="site-footer__social" aria-label="Social media links">
          <a
            href="https://www.spotify.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Spotify"
          >
            <i class="fa-brands fa-spotify"></i>
          </a>
          <a
            href="https://www.facebook.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Facebook"
          >
            <i class="fa-brands fa-facebook"></i>
          </a>
          <a
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >
            <i class="fa-brands fa-instagram"></i>
          </a>
          <a
            href="https://x.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="X"
          >
            <i class="fa-brands fa-x-twitter"></i>
          </a>
          <a
            href="https://www.youtube.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="YouTube"
          >
            <i class="fa-brands fa-youtube"></i>
          </a>
          <a
            href="https://www.tiktok.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="TikTok"
          >
            <i class="fa-brands fa-tiktok"></i>
          </a>
        </nav>
      </div>
    </footer>

    <!-- Load Bootstrap's JavaScript bundle for interactive components,
         including the collapsible navigation menu. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

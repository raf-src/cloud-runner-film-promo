<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Cloud Runner</title>
  </head>
  <body>
    <header class="hero">
      <nav
        class="navbar navbar-expand-lg cloud-navbar"
        aria-label="Primary navigation"
      >
        <div class="container-fluid cloud-navbar__inner">
          <a
            class="navbar-brand cloud-brand"
            href="/"
            aria-label="Cloud Runner home"
          >
            CLOUD RUNNER
          </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavigation"
            aria-controls="mainNavigation"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="mainNavigation">
            <ul class="navbar-nav ms-auto align-items-lg-center">
              <li class="nav-item">
                <a
                  class="nav-link cloud-nav-link active"
                  href="#trailer"
                  aria-current="page"
                >
                  TRAILER
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link cloud-nav-link" href="#world">WORLD</a>
              </li>
              <li class="nav-item">
                <a class="nav-link cloud-nav-link" href="#updates">
                  GET UPDATES
                </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <!-- Hero content goes here -->
    </header>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
